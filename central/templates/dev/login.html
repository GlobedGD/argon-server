{% extends "dev/layout.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<article class="login-card">
    <h1 style="text-align:center;">Log in</h1>
    <form method="POST" action="/dev/login">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" value="{{ username }}" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>

        {% if let Some(error) = error %}
        <p class="form-error" role="alert">{{ error }}</p>
        {% endif %}

        <button type="submit" style="width: fit-content; padding: 10px 24px; display: block; margin: auto;">Log in</button>
    </form>
</article>
{% endblock %}
