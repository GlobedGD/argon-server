<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Argon{% endblock %}</title>

    <link rel="stylesheet" href="/assets/pico.min.css">
    <link rel="stylesheet" href="/assets/dev.css">
</head>

<body>
    <header class="container">
        <nav>
            <ul>
                <li><strong>Argon</strong></li>
            </ul>
            <ul>
                {% if me is defined %}
                <li><a class="nav-btn" href="/dev">Dashboard</a></li>
                {% if me.is_admin %}
                <li><a class="nav-btn" href="/dev/admin">Admin</a></li>
                {% endif %}

                <li>
                    <form method="POST" action="/dev/logout">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                        <button class="nav-btn outline" type="submit">Logout</button>
                    </form>
                </li>
                {% endif %}
            </ul>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script src="/assets/dev.js" defer></script>
</body>

</html>
