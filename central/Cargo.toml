[package]
name = "central"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { path = "../shared" }
migration = { path = "./migration" }
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "macros"] }
config = "0.15.27"
dashmap = { version = "6.2.1", features = ["inline"] }
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
rand = "0.10.3"
sea-orm = { version = "2.0.4", features = [
    "sqlx-sqlite",
    "runtime-tokio",
    "macros",
    "uuid",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["full"] }
tracing = "0.1.44"
validator = { version = "0.21.0", features = ["derive"] }
constant_time_eq = "0.6.1"
parking_lot = "0.13.0"
strum = "0.28.0"
log = "0.4.34"
hex = "0.4.3"
humantime-serde = "1.1.1"
reqwest = { version = "0.13.5", features = ["form", "zstd", "json"] }
chrono = "0.4.45"
argon2 = "0.6.0"
governor = { version = "0.10.4", default-features = false, features = [
    "jitter",
    "std",
] }
uuid = { version = "1.29.0", features = ["v4"] }
tower-sessions = "0.15.0"
async-trait = "0.1.92"
tower-sessions-core = "0.15.0"
time = "0.3.55"
askama = { version = "0.16.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs"] }
moka = { version = "0.12.16", features = ["future", "sync"] }
tower-cookies = { version = "0.11.0", features = ["signed"] }

[features]
docker = ["shared/docker"]
