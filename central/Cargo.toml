[package]
name = "central"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { path = "../shared" }
migration = { path = "./migration" }
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "macros"] }
config = "0.15.27"
dashmap = { version = "6.2.1", features = ["inline"] }
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
rand = "0.10.3"
sea-orm = { version = "2.0.4", features = [
    "sqlx-sqlite",
    "runtime-tokio",
    "macros",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["full"] }
tracing = "0.1.44"
validator = { version = "0.21.0", features = ["derive"] }
constant_time_eq = "0.6.1"
parking_lot = "0.13.0"
strum = "0.28.0"
log = "0.4.34"
hex = "0.4.3"
humantime-serde = "1.1.1"
