[package]
name = "argon-server"
version = "0.1.0"
edition = "2024"

[dependencies]
argon-shared = { path = "../shared" }
argon-node = { path = "../node" }
rocket = { version = "0.5.1", features = ["json", "secrets"] }
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
anyhow = "1.0.102"
json_comments = "0.2.2"
async-watcher = "0.4.0"
hex = "0.4.3"
rand = "0.10.1"
ipnet = "2.12.0"
iprange = "0.6.7"
hmac = "0.13.0"
blake3 = "1.8.5"
base64 = "0.22.1"
bytebuffer = "2.3.0"
nohash-hasher = "0.2.0"
parking_lot = { version = "0.12.5", features = ["send_guard"] }
diesel = { version = "2.3.9", features = [
    "sqlite",
    "returning_clauses_for_sqlite_3_35",
] }
libsqlite3-sys = { version = "0.37", features = ["bundled"] }
diesel_migrations = { version = "2.3.2", features = ["sqlite"] }
rocket_cors = "0.6.0"
rocket_ws = "0.1.1"
thiserror = "2.0.18"
zstd = "0.13.3"
bytes = "1.11.1"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.6.1", optional = true }

[dependencies.rocket_sync_db_pools]
version = "0.1.0"
features = ["diesel_sqlite_pool"]

[features]
default = []
jemalloc = ["dep:tikv-jemallocator"]
