[package]
name = "node"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
config = "0.15.27"
dashmap = { version = "6.2.1", features = ["inline"] }
parking_lot = "0.13.0"
reqwest = { version = "0.13.5", features = ["form", "zstd"] }
serde = { version = "1.0.229", features = ["derive"] }
shared = { path = "../shared", features = ["client"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
validator = { version = "0.21.0", features = ["derive"] }

[features]
docker = ["shared/docker"]
