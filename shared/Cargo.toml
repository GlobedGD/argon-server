[package]
name = "shared"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
postcard = { version = "1.1.3", features = ["alloc", "use-std"] }
qunet = { git = "https://github.com/dankmeme01/qunet", rev = "v1.2.0", default-features = false, features = [
    "quic",
] }
serde = { version = "1.0.229", features = ["derive"] }
validator = { version = "0.21.0", features = ["derive"] }
tracing = "0.1.44"
tracing-appender = { version = "0.2.5", features = ["parking_lot"] }
tracing-subscriber = "0.3.23"
strum = { version = "0.28.0", features = ["derive"] }

[features]
client = ["qunet/client"]
docker = []
