[package]
name = "argon-shared"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
colored = "3.1.1"
crypto_box = { version = "0.9.1", default-features = false, features = ["alloc", "getrandom", "rand_core", "chacha20"] }
crypto_secretbox = { version = "0.1.1", default-features = false, features = ["alloc", "getrandom", "rand_core", "chacha20"] }
hex = "0.4.3"
int-enum = "1.2.0"
log = "0.4.29"
parking_lot = "0.12.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
time = { version = "0.3.47", features = ["formatting"] }
tokio = { version = "1.52.3", features = ["full"] }
zstd = "0.13.3"
